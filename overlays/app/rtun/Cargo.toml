[package]
name = "rtun"
version = "0.1.0"
edition = "2021"
description = "Reverse port-forwarding and reverse SOCKS5 tunnel over a custom protocol"

[[bin]]
name = "rtun"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
socket2 = "0.6"
time = { version = "0.3", features = ["macros", "local-offset", "formatting"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
] }
tracing = { version = "0.1", default-features = false, features = [
  "attributes",
  "std",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "fmt",
  "time",
] }

[profile.release]
lto = true
strip = true
# Not "z": size-optimised codegen costs the AEAD loops ~4x the CPU per byte.
opt-level = 3
codegen-units = 1
panic = "abort"
